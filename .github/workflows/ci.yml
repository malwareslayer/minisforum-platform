name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  checkpatch:
    name: Checkpatch Style Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kernel Scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic perl wget

      - name: Run checkpatch.pl --strict
        run: |
          CHECKPATCH="$(find /usr/src/linux-headers-* -name checkpatch.pl 2>/dev/null | head -n 1)"
          if [ -n "$CHECKPATCH" ] && [ -f "$CHECKPATCH" ]; then
            echo "Using system checkpatch: $CHECKPATCH"
          else
            echo "Downloading upstream checkpatch..."
            curl -fsSL --retry 3 https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl -o /tmp/checkpatch.pl
            curl -fsSL --retry 3 https://raw.githubusercontent.com/torvalds/linux/master/scripts/spelling.txt -o /tmp/spelling.txt 2>/dev/null || true
            chmod +x /tmp/checkpatch.pl
            CHECKPATCH="/tmp/checkpatch.pl"
          fi
          "$CHECKPATCH" --strict --no-tree -f src/*.[ch]

  build:
    name: Compile Kernel Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic dkms

      - name: Build Module
        run: |
          make clean
          make modules

      - name: Verify DKMS Packaging
        run: |
          sudo make dkms-install
          sudo make dkms-uninstall
